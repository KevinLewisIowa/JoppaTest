<form [formGroup]="passwordForm">
  <div class="card" style="opacity:0.93">
    <div class="card-header text-center">
      <h2>Change Regular Password</h2>
    </div>
    <div class="panel-body" style="opacity:0.93">
      <div class="entry-box">
        <div class="form-group">
          <label>New Password:</label>
          <div class="input-group" style="max-width: 50%;">
            <input [type]="showNewPassword ? 'text' : 'password'" class="form-control" placeholder="New Password" #newpswrd formControlName="new_password" />
            <button
              type="button"
              class="btn btn-outline-secondary"
              (click)="showNewPassword = !showNewPassword"
              [attr.aria-label]="showNewPassword ? 'Hide new password' : 'Show new password'"
              [title]="showNewPassword ? 'Hide new password' : 'Show new password'">
              <fa-icon [icon]="showNewPassword ? eyeSlashIcon : eyeIcon"></fa-icon>
            </button>
          </div>
        </div>
        <div class="form-group">
          <label>Confirm Password:</label>
          <div class="input-group" style="max-width: 50%;">
            <input class="form-control" [type]="showConfirmPassword ? 'text' : 'password'" placeholder="Confirm Password" #confirmpswrd formControlName="confirm_password" />
            <button
              type="button"
              class="btn btn-outline-secondary"
              (click)="showConfirmPassword = !showConfirmPassword"
              [attr.aria-label]="showConfirmPassword ? 'Hide password confirmation' : 'Show password confirmation'"
              [title]="showConfirmPassword ? 'Hide password confirmation' : 'Show password confirmation'">
              <fa-icon [icon]="showConfirmPassword ? eyeSlashIcon : eyeIcon"></fa-icon>
            </button>
          </div>
        </div>
        <span style="color:red;" *ngIf="newpswrd.value != confirmpswrd.value">Passwords do not match</span>
      </div>
    </div>
    <div class="card-footer">
      <button routerLink="/adminHome" class="btn btn-primary" style="float: left" (click)="back()"><fa-icon [icon]="backIcon"></fa-icon> Back</button>
      <button type="button" [disabled]="newpswrd.value != confirmpswrd.value || !passwordForm.valid" (click)="submitPassword()" class="btn btn-primary" style="float: right;">Submit Password</button>
    </div>
  </div>
</form>

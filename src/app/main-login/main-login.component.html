<div class="card" style="opacity:0.93">
  <div class="card-header text-center" id="topOfScreen">
    <h2>Login</h2>
  </div>
  <div class="panel-body" style="opacity: 0.93;">
    <!-- Tab buttons to switch between login modes -->
    <div class="login-mode-tabs" style="text-align: center; margin-bottom: 20px;">
      <button 
        type="button" 
        (click)="toggleLoginMode()" 
        class="btn"
        [class.btn-primary]="isAdminLogin"
        [class.btn-secondary]="!isAdminLogin"
        style="margin-right: 10px;">
        Admin Login
      </button>
      <button 
        type="button" 
        (click)="toggleLoginMode()" 
        class="btn"
        [class.btn-primary]="!isAdminLogin"
        [class.btn-secondary]="isAdminLogin">
        Volunteer Login
      </button>
    </div>

    <!-- Admin Login Form (Email + Password) -->
    <form *ngIf="isAdminLogin" [formGroup]="adminLoginForm" style="margin: 0 auto; max-width: 50%;">
      <div class="form-group">
        <label for="email">Email: </label>
        <input 
          id="email" 
          class="form-control" 
          type="email" 
          formControlName="email"
          placeholder="admin@example.com" />
        <small class="text-danger" *ngIf="adminLoginForm.get('email').hasError('required') && adminLoginForm.get('email').touched">
          Email is required
        </small>
        <small class="text-danger" *ngIf="adminLoginForm.get('email').hasError('email') && adminLoginForm.get('email').touched">
          Invalid email format
        </small>
      </div>
      <div class="form-group">
        <label for="password">Password: </label>
        <div class="input-group">
          <input
            id="password"
            class="form-control"
            [type]="showAdminPassword ? 'text' : 'password'"
            formControlName="password"
            placeholder="Enter your password" />
          <button
            type="button"
            class="btn btn-outline-secondary"
            (click)="showAdminPassword = !showAdminPassword"
            [attr.aria-label]="showAdminPassword ? 'Hide password' : 'Show password'"
            [title]="showAdminPassword ? 'Hide password' : 'Show password'">
            <fa-icon [icon]="showAdminPassword ? eyeSlashIcon : eyeIcon"></fa-icon>
          </button>
        </div>
        <small class="text-danger" *ngIf="adminLoginForm.get('password').hasError('required') && adminLoginForm.get('password').touched">
          Password is required
        </small>
      </div>
      <div class="alert alert-danger" *ngIf="invalidText" role="alert">
        {{ errorMessage || 'Login failed. Please check your credentials.' }}
      </div>
      <div *ngIf="isLoading" class="alert alert-info" role="alert">
        Logging in...
      </div>
    </form>

    <!-- Legacy Login Form (Password Only) -->
    <form *ngIf="!isAdminLogin" [formGroup]="legacyLoginForm" style="margin: 0 auto; max-width: 50%;">
      <div class="form-group">
        <label for="pwd">Password: </label>
        <div class="input-group">
          <input
            id="pwd"
            class="form-control"
            [type]="showLegacyPassword ? 'text' : 'password'"
            formControlName="the_password"
            placeholder="Enter password" />
          <button
            type="button"
            class="btn btn-outline-secondary"
            (click)="showLegacyPassword = !showLegacyPassword"
            [attr.aria-label]="showLegacyPassword ? 'Hide password' : 'Show password'"
            [title]="showLegacyPassword ? 'Hide password' : 'Show password'">
            <fa-icon [icon]="showLegacyPassword ? eyeSlashIcon : eyeIcon"></fa-icon>
          </button>
        </div>
      </div>
      <div class="alert alert-danger" *ngIf="invalidText" role="alert">
        {{ errorMessage || 'Login failed. Please check your password.' }}
      </div>
      <div *ngIf="isLoading" class="alert alert-info" role="alert">
        Logging in...
      </div>
    </form>
  </div>

  <div class="card-footer text-center">
    <button 
      type="button" 
      (click)="login()" 
      [disabled]="isLoading || (isAdminLogin && !adminLoginForm.valid) || (!isAdminLogin && !legacyLoginForm.valid)"
      style="float:right;" 
      class="btn btn-primary">
      Login 
      <fa-icon [icon]="forwardIcon"></fa-icon>
    </button>
  </div>
</div>

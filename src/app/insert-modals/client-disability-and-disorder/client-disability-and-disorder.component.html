<ng-template #clientDisabilityAndDisorderMdl let-c="close" let-d="dismiss">
  <div class="modal-header">
    <h4 class="modal-title">
      {{ category === 'physical_disability' ? 'Physical Disability' : category === 'mental_disability' ? 'Mental Disability' : 'Substance Use Disorder' }}
    </h4>
    <button type="button" class="close" aria-label="Close" (click)="d('Cross click')">
      <span aria-hidden="true">&times;</span>
    </button>
  </div>
  <div class="modal-body">
    <div class="row mb-3">
      <div class="col-md-6" *ngIf="category !== 'substance_use_disorder'">
        <label>Diagnosis status</label>
        <select class="form-control" [(ngModel)]="record.diagnosis_status" name="diagnosis_status">
          <option value="">Select an option</option>
          <option *ngFor="let option of disabilityStatusOptions" [value]="option">{{ option }}</option>
        </select>
      </div>
      <div class="col-md-6" *ngIf="category === 'substance_use_disorder'">
        <label>Diagnosis status</label>
        <select class="form-control" [(ngModel)]="record.diagnosis_status" name="diagnosis_status">
          <option value="">Select an option</option>
          <option value="Yes">Yes</option>
          <option value="No">No</option>
          <option value="Preferred not to share">Preferred not to share</option>
          <option value="Unknown">Unknown</option>
        </select>
      </div>
      <div class="col-md-6">
        <label>Type</label>
        <ng-container [ngSwitch]="category">
          <select *ngSwitchCase="'physical_disability'" class="form-control" [(ngModel)]="record.type_name" name="type_name">
            <option value="">Select an option</option>
            <option *ngFor="let option of physicalDisabilityTypes" [value]="option">{{ option }}</option>
          </select>
          <select *ngSwitchCase="'mental_disability'" class="form-control" [(ngModel)]="record.type_name" name="type_name">
            <option value="">Select an option</option>
            <option *ngFor="let option of mentalDisabilityTypes" [value]="option">{{ option }}</option>
          </select>
          <select *ngSwitchDefault class="form-control" [(ngModel)]="record.type_name" name="type_name">
            <option value="">Select an option</option>
            <option *ngFor="let option of substanceUseDisorderTypes" [value]="option">{{ option }}</option>
          </select>
        </ng-container>
      </div>
    </div>

    <div class="row mb-3">
      <div class="col-md-6" *ngIf="category !== 'substance_use_disorder'">
        <label>Year diagnosed</label>
        <select class="form-control" [(ngModel)]="record.year_diagnosed" name="year_diagnosed">
          <option [ngValue]="null">Select a year</option>
          <option *ngFor="let year of yearDiagnosedOptions" [ngValue]="year">{{ year }}</option>
        </select>
      </div>
      <div class="col-md-6" *ngIf="category === 'substance_use_disorder'">
        <label>Has this been clinically diagnosed?</label>
        <select class="form-control" [(ngModel)]="record.clinically_diagnosed" name="clinically_diagnosed">
          <option value="">Select an option</option>
          <option *ngFor="let option of clinicalDiagnosisOptions" [value]="option">{{ option }}</option>
        </select>
      </div>
      <div class="col-md-6" *ngIf="category === 'substance_use_disorder'">
        <label>Year diagnosed</label>
        <select class="form-control" [(ngModel)]="record.year_diagnosed" name="year_diagnosed">
          <option [ngValue]="null">Select a year</option>
          <option *ngFor="let year of yearDiagnosedOptions" [ngValue]="year">{{ year }}</option>
        </select>
      </div>
    </div>

    <div class="row mb-3">
      <div class="col-md-12">
        <label>Note</label>
        <textarea class="form-control" rows="3" [(ngModel)]="record.note" name="note"></textarea>
      </div>
    </div>
  </div>
  <div class="modal-footer">
    <button type="button" class="btn btn-outline-secondary" (click)="d('Cancel click')">Cancel</button>
    <button type="button" class="btn btn-primary" (click)="submitRecord()">Save</button>
  </div>
</ng-template>
